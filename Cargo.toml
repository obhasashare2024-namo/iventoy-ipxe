[package]
name = "iventoy-ipxe"
version = "2.0.0"
edition = "2021"
description = "100% Standalone Pure Rust All-in-One iVentoy / iPXE Network Boot Server"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync", "fs", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["io"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
